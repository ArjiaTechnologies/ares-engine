name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        if: github.event.repository.visibility == 'public' || github.event.repository.security_and_analysis.advanced_security.status == 'enabled'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Record unsupported private-repository review
        if: github.event.repository.visibility != 'public' && github.event.repository.security_and_analysis.advanced_security.status != 'enabled'
        run: echo 'Dependency Review requires GitHub Advanced Security for this private repository; pip-audit remains required in CI.'
