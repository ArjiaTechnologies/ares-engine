name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.repository.visibility == 'public' || github.event.repository.security_and_analysis.advanced_security.status == 'enabled'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: python
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
  unsupported-private-repository:
    if: github.event.repository.visibility != 'public' && github.event.repository.security_and_analysis.advanced_security.status != 'enabled'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'CodeQL requires GitHub Code Security for this private repository; the workflow will analyze when that licensed feature is enabled.'
