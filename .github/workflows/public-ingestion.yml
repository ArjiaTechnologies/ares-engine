name: Public ingestion audit (manual)

on:
  workflow_dispatch:
    inputs:
      start:
        description: Optional UTC start (defaults to 15 days before the computed end)
        required: false
        type: string
      end:
        description: Optional UTC end (defaults to 72 hours before current UTC)
        required: false
        type: string

permissions:
  contents: read

jobs:
  live-public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Select bounded historical window
        id: window
        env:
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import UTC, datetime, timedelta
          end = os.environ.get("INPUT_END") or (datetime.now(UTC) - timedelta(hours=72)).replace(minute=0, second=0, microsecond=0).isoformat().replace("+00:00", "Z")
          parsed_end = datetime.fromisoformat(end.replace("Z", "+00:00"))
          start = os.environ.get("INPUT_START") or (parsed_end - timedelta(days=15)).isoformat().replace("+00:00", "Z")
          print(f"start={start}")
          print(f"end={end}")
          PY
      - name: Run production ingestion twice and validate evidence
        run: >-
          uv run ares verify-public-ingestion
          --primary coinbase --validation kraken
          --symbol ETH/USD --timeframe 1h
          --start "${{ steps.window.outputs.start }}"
          --end "${{ steps.window.outputs.end }}"
          --page-limit 60
          --output artifacts/public-ingestion-audit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-ingestion-evidence
          path: artifacts/public-ingestion-audit/
          if-no-files-found: error
